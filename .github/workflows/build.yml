name: Build
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check test script syntax
        run: |
          node --check tests/r15.mjs
          node --check tests/responsive-links.mjs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Responsive layout and link CRUD e2e
        env:
          ADMIN_PASSWORD: ci-test-password-only
          SESSION_SECRET: ci-test-session-secret-only
          CRON_SECRET: ci-test-cron-secret-only
          BASE_URL: http://127.0.0.1:3111
        run: |
          npm run start -- -H 0.0.0.0 -p 3111 > /tmp/bio-link-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          const url = process.env.BASE_URL;
          for (let attempt = 0; attempt < 60; attempt += 1) {
            try {
              const response = await fetch(url);
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          console.error("Next.js server did not become ready:");
          process.exit(1);
          NODE
          npm run test:responsive
