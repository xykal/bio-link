name: Screenshots (Emulator)

# Ambil screenshot ASLI dari aplikasi Android yang ada di release xykal,
# jalan di emulator x86_64 dengan KVM (tersedia untuk repo publik).
# Hasil: public/shots/*.webp di-commit, plus artifact PNG mentah.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Catatan (opsional)"
        required: false
        default: "ambil screenshot project"

permissions:
  contents: write

concurrency:
  group: shots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          df -h /

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pasang ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp

      - name: Unduh APK
        run: bash scripts/fetch-apks.sh

      - name: Boot emulator & ambil screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash scripts/emulator-shots.sh

      - name: Upload screenshot mentah
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-shots
          path: raw-shots/
          retention-days: 14
          if-no-files-found: warn

      - name: Optimasi & commit WebP
        if: always()
        run: bash scripts/shots-commit.sh

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Screenshot emulator"
            echo ""
            if [ -d raw-shots ]; then
              ls -lh raw-shots | tail -n +2
            else
              echo "Tidak ada file."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
